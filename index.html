<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ножи — 3D</title>
<style>
  :root {
    --bg: #12100e; --panel: #1c1917; --line: #2a2622;
    --steel: #cfd6dd; --steel-dark: #8b949e; --accent: #e8a33d;
    --good: #6fbf73; --bad: #d2685c; --text: #e8e2d9; --muted: #9a9187;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #24201b 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh; padding: 40px 20px 80px;
  }
  header { text-align: center; margin-bottom: 40px; animation: fadeUp .7s ease both; }
  h1 {
    font-size: clamp(28px, 4vw, 48px); letter-spacing: .04em;
    background: linear-gradient(90deg, var(--steel), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { color: var(--muted); margin-top: 10px; font-size: 15px; }

  .filters {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    margin-bottom: 36px; animation: fadeUp .7s .1s ease both;
  }
  .filters button {
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    padding: 9px 18px; border-radius: 999px; cursor: pointer; font-size: 14px;
    transition: all .25s ease;
  }
  .filters button:hover { border-color: var(--steel-dark); color: var(--text); }
  .filters button.active {
    background: var(--accent); color: #1a1612; border-color: var(--accent); font-weight: 600;
  }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 22px; max-width: 1200px; margin: 0 auto;
  }

  .card {
    background: linear-gradient(180deg, #201c18, var(--panel));
    border: 1px solid var(--line); border-radius: 18px; padding: 22px;
    position: relative; overflow: hidden;
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    animation: cardIn .55s ease both;
  }
  .card:hover {
    transform: translateY(-4px); border-color: var(--steel-dark);
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
  }

  /* === 3D СЦЕНА === */
  .stage {
    width: 100%; height: 180px;
    display: flex; align-items: center; justify-content: center;
    perspective: 800px;
    cursor: grab;
    margin-bottom: 14px;
    touch-action: none;
    user-select: none;
  }
  .stage:active { cursor: grabbing; }
  .rotor {
    width: 260px; height: 140px;
    transform-style: preserve-3d;
    transform: rotateX(-8deg) rotateY(0deg);
    transition: transform .05s linear;
    position: relative;
  }
  .rotor .plate {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    backface-visibility: visible;
  }
  .rotor .plate svg { height: 100%; width: auto; }

  /* Толщина клинка: копии слоя сзади */
  .rotor .layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .rotor .layer svg { height: 100%; width: auto; filter: brightness(.75); }

  .hint {
    position: absolute; bottom: 6px; right: 12px;
    font-size: 10px; color: var(--muted); opacity: .6;
    letter-spacing: .06em; text-transform: uppercase; pointer-events: none;
  }

  .card h2 { font-size: 19px; margin-bottom: 4px; }
  .card .type {
    display: inline-block; font-size: 11px; text-transform: uppercase;
    letter-spacing: .1em; color: var(--accent); margin-bottom: 16px;
  }

  .price {
    position: absolute; top: 16px; left: 16px;
    font-size: 13px; font-weight: 600; color: var(--accent);
    border: 1px solid rgba(232,163,61,.4);
    border-radius: 999px; padding: 3px 11px;
    background: rgba(232,163,61,.08);
  }
  .tag {
    position: absolute; top: 16px; right: 16px;
    font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
  }

  .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .lists h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px;
  }
  .lists .pros h3 { color: var(--good); }
  .lists .cons h3 { color: var(--bad); }
  .lists ul { list-style: none; }
  .lists li {
    font-size: 13px; color: var(--muted); padding: 4px 0 4px 14px;
    position: relative; line-height: 1.45;
  }
  .lists li::before { position: absolute; left: 0; top: 4px; font-size: 12px; }
  .pros li::before { content: "+"; color: var(--good); font-weight: 700; }
  .cons li::before { content: "−"; color: var(--bad); font-weight: 700; }

  .empty {
    text-align: center; color: var(--muted); grid-column: 1 / -1; padding: 60px 0;
  }

  @media (max-width: 480px) {
    .lists { grid-template-columns: 1fr; }
    .stage { height: 150px; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>

<header>
  <h1>Ножи</h1>
  <p>Три глаза на каждый клинок — крути как хочешь.</p>
</header>

<div class="filters" id="filters">
  <button data-filter="all" class="active">Все</button>
  <button data-filter="fixed">Фиксед</button>
  <button data-filter="folder">Складные</button>
  <button data-filter="kitchen">Кухонные</button>
</div>

<div class="grid" id="grid"></div>

<script>
// Форма клинка задаётся полем path (SVG path данных).
// Каждый нож имеет свой силуэт: разные рукояти, обухи, кончики.
const knives = [
  {
    name: "Ka-Bar USMC", type: "fixed", typeLabel: "Фиксед", tag: "Полевой",
    price: "45 $",
    blade: "M30 78 L150 78 L185 66 L168 58 L150 62 L60 58 L30 62 Z",
    handle: "M8 62 L30 60 L30 80 L8 78 Z",
    guard: "M28 52 L34 52 L34 88 L28 88 Z",
    pros: ["Ломается редко", "Пронзает всё подряд", "Цена-качество топ"],
    cons: ["Тяжёлый на поясе", "Кожан — отстой", "Рукоять скользит от крови"]
  },
  {
    name: "Opinel No. 8", type: "folder", typeLabel: "Складной", tag: "Классика",
    price: "15 $",
    blade: "M40 64 L160 60 Q175 58 178 64 Q175 70 160 68 L40 72 Z",
    handle: "M10 60 Q10 56 18 56 L40 58 L40 74 L18 74 Q10 74 10 70 Z",
    guard: null,
    pros: ["Копеечный", "Лёгкий, карман не тянет", "Сталь с углеродом — рез на пятёрку"],
    cons: ["Ржавеет от взгляда", "Замок-вироблок разболтается", "Одной рукой не откроешь"]
  },
  {
    name: "Spyderco Delica", type: "folder", typeLabel: "Складной", tag: "EDC",
    price: "95 $",
    blade: "M42 66 L150 66 L178 48 L168 58 L168 70 L150 72 L42 72 Z",
    handle: "M8 60 L42 60 L42 76 L8 76 Z",
    guard: null,
    pros: ["Открывается большим пальцем", "VG-10 держит кромку", "Клипса в комплекте"],
    cons: ["Цена кусает", "Рукоять пластик", "Люфт фрейма со временем"]
  },
  {
    name: "Victorinox Santoku", type: "kitchen", typeLabel: "Кухонный", tag: "Кухня",
    price: "40 $",
    blade: "M30 92 L155 92 Q180 84 182 58 Q178 50 168 54 L30 66 Z",
    handle: "M6 68 L30 66 L30 86 L6 88 Z",
    guard: "M28 64 L34 64 L34 92 L28 92 Z",
    pros: ["Режет овощи как масло", "Нержавейка не ржавеет", "Точится легко"],
    cons: ["Тонкое лезвие ломко на костях", "Рукоять простая", "Не для тяжёлой работы"]
  },
  {
    name: "Morakniv Companion", type: "fixed", typeLabel: "Фиксед", tag: "Аутдор",
    price: "18 $",
    blade: "M40 60 L155 60 Q180 62 182 72 Q176 78 160 76 L40 76 Z",
    handle: "M8 60 Q8 56 16 56 L40 58 L40 78 L16 78 Q8 78 8 74 Z",
    guard: null,
    pros: ["Дешёвый и неубиваемый", "Углеродка скандинав", "Чехол в комплекте"],
    cons: ["Рукоять простенькая", "Ножны люфтят", "Ржавеет без ухода"]
  },
  {
    name: "Gerber LMF II", type: "fixed", typeLabel: "Фиксед", tag: "Тактикал",
    price: "110 $",
    blade: "M35 78 L145 78 L182 60 L175 52 L155 60 L60 56 L35 60 Z",
    handle: "M6 60 L35 58 L35 80 L6 78 Z",
    guard: "M33 50 L39 50 L39 88 L33 88 Z",
    pros: ["Выживает после падений", "Рукоять не натирает", "Режет провода и ремни"],
    cons: ["Тяжёлый", "Рукоять толстая под маленькую руку", "Цена за бренд"]
  }
];

// Сборка SVG с параметрами формы (каждый нож уникален).
const knifeSVG = (k, opacity = 1) => {
  const color = k.type === "kitchen" ? "#e6eef5" : "#cfd6dd";
  return `<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" style="opacity:${opacity}">
    <defs>
      <linearGradient id="steel-${k.name.replace(/\s/g,'')}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#eef2f5"/>
        <stop offset=".5" stop-color="#b9c2cb"/>
        <stop offset="1" stop-color="#7d868f"/>
      </linearGradient>
    </defs>
    <path d="${k.blade}" fill="url(#steel-${k.name.replace(/\s/g,'')})" stroke="#5d666e" stroke-width="1.5" stroke-linejoin="round"/>
    ${k.guard ? `<path d="${k.guard}" fill="#3a2f26" stroke="#241d17" stroke-width="1.2"/>` : ""}
    <path d="${k.handle}" fill="#4a3b2e" stroke="#241d17" stroke-width="1.5"/>
    <circle cx="${k.type === 'folder' ? 26 : 22}" cy="${k.type === 'kitchen' ? 77 : 69}" r="2" fill="#cfd6dd" opacity=".7"/>
    <circle cx="${k.type === 'folder' ? 34 : 30}" cy="${k.type === 'kitchen' ? 77 : 69}" r="2" fill="#cfd6dd" opacity=".7"/>
  </svg>`;
};

// Собираем карточку с 3D-сценой и драг-управлением по X и Y.
const buildStage = (k) => {
  const layers = [];
  // 6 тонких слоёв сзади создают ощущение объёма клинка.
  for (let i = 6; i >= 1; i--) {
    layers.push(`<div class="layer" style="transform: translateZ(${-i * 1.2}px); opacity:${0.12 + (6 - i) * 0.04}">${knifeSVG(k, 1)}</div>`);
  }
  return `
    <div class="stage" data-knife="${k.name}">
      <div class="rotor">
        <div class="layer" style="transform: translateZ(0)">${knifeSVG(k, 1)}</div>
        ${layers.join("")}
      </div>
      <span class="hint">крути</span>
    </div>
  `;
};

const grid = document.getElementById("grid");

function render(filter = "all") {
  const list = filter === "all" ? knives : knives.filter(k => k.type === filter);
  if (!list.length) {
    grid.innerHTML = `<div class="empty">Пусто. Другие фильтры потыкай.</div>`;
    return;
  }
  grid.innerHTML = list.map(k => `
    <article class="card">
      <span class="price">${k.price}</span>
      <span class="tag">${k.tag}</span>
      ${buildStage(k)}
      <h2>${k.name}</h2>
      <span class="type">${k.typeLabel}</span>
      <div class="lists">
        <div class="pros"><h3>Плюсы</h3><ul>${k.pros.map(p => `<li>${p}</li>`).join("")}</ul></div>
        <div class="cons"><h3>Минусы</h3><ul>${k.cons.map(c => `<li>${c}</li>`).join("")}</ul></div>
      </div>
    </article>
  `).join("");

  initDrag();
}

// Драг-управление вращением по X (верх-вниз) и Y (влево-вправо).
function initDrag() {
  document.querySelectorAll(".stage").forEach(stage => {
    const rotor = stage.querySelector(".rotor");
    let dragging = false, lastX = 0, lastY = 0;
    let rotX = -8, rotY = 0;
    let vy = 0, vx = 0; // инерция
    let raf = null;

    const apply = () => {
      rotor.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    };

    const momentum = () => {
      if (!dragging) {
        rotY += vy; rotX += vx;
        vy *= 0.94; vx *= 0.94;
        if (Math.abs(vy) > 0.1 || Math.abs(vx) > 0.1) {
          apply();
          raf = requestAnimationFrame(momentum);
        } else {
          // плавно возвращаем наклон X в исходное положение
          if (Math.abs(rotX + 8) > 0.5) {
            rotX += (-8 - rotX) * 0.08;
            apply();
            raf = requestAnimationFrame(momentum);
          } else {
            rotX = -8; apply(); raf = null;
          }
        }
      }
    };

    const down = (e) => {
      dragging = true;
      const p = e.touches ? e.touches[0] : e;
      lastX = p.clientX; lastY = p.clientY;
      vy = 0; vx = 0;
      if (raf) cancelAnimationFrame(raf);
    };

    const move = (e) => {
      if (!dragging) return;
      e.preventDefault();
      const p = e.touches ? e.touches[0] : e;
      const dx = p.clientX - lastX;
      const dy = p.clientY - lastY;
      lastX = p.clientX; lastY = p.clientY;
      rotY += dx * 0.8;
      rotX -= dy * 0.8;
      rotX = Math.max(-90, Math.min(90, rotX));
      vy = dx * 0.8;
      vx = -dy * 0.8;
      apply();
    };

    const up = () => {
      if (!dragging) return;
      dragging = false;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(momentum);
    };

    stage.addEventListener("mousedown", down);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    stage.addEventListener("touchstart", down, { passive: true });
    stage.addEventListener("touchmove", move, { passive: false });
    stage.addEventListener("touchend", up);

    apply();
  });
}

document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render(btn.dataset.filter);
});

render();
</script>
</body>
</html>
