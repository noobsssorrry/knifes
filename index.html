<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ножи — плюсы и минусы</title>
<style>
  :root {
    --bg: #12100e;
    --panel: #1c1917;
    --line: #2a2622;
    --steel: #cfd6dd;
    --steel-dark: #8b949e;
    --accent: #e8a33d;
    --good: #6fbf73;
    --bad: #d2685c;
    --text: #e8e2d9;
    --muted: #9a9187;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #24201b 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
  }
  header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeUp .7s ease both;
  }
  h1 {
    font-size: clamp(28px, 4vw, 48px);
    letter-spacing: .04em;
    background: linear-gradient(90deg, var(--steel), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); margin-top: 10px; font-size: 15px; }

  .filters {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 36px;
    animation: fadeUp .7s .1s ease both;
  }
  .filters button {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    transition: all .25s ease;
  }
  .filters button:hover { border-color: var(--steel-dark); color: var(--text); }
  .filters button.active {
    background: var(--accent);
    color: #1a1612;
    border-color: var(--accent);
    font-weight: 600;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 22px;
    max-width: 1180px;
    margin: 0 auto;
  }

  .card {
    background: linear-gradient(180deg, #201c18, var(--panel));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    position: relative;
    overflow: hidden;
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    animation: cardIn .55s ease both;
  }
  .card:nth-child(1) { animation-delay: .05s; }
  .card:nth-child(2) { animation-delay: .1s; }
  .card:nth-child(3) { animation-delay: .15s; }
  .card:nth-child(4) { animation-delay: .2s; }
  .card:nth-child(5) { animation-delay: .25s; }
  .card:nth-child(6) { animation-delay: .3s; }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(400px 120px at var(--mx, 50%) 0%, rgba(232,163,61,.16), transparent 70%);
    opacity: 0;
    transition: opacity .35s ease;
    pointer-events: none;
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: var(--steel-dark);
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
  }
  .card:hover::before { opacity: 1; }

  .blade {
    width: 100%;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }
  .blade svg { height: 100%; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
  .card:hover .blade svg { animation: shing .6s ease; }

  .card h2 { font-size: 19px; margin-bottom: 4px; }
  .card .type {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .lists h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 8px;
  }
  .lists .pros h3 { color: var(--good); }
  .lists .cons h3 { color: var(--bad); }
  .lists ul { list-style: none; }
  .lists li {
    font-size: 13px;
    color: var(--muted);
    padding: 4px 0 4px 14px;
    position: relative;
    line-height: 1.45;
  }
  .lists li::before {
    position: absolute;
    left: 0;
    top: 4px;
    font-size: 12px;
  }
  .pros li::before { content: "+"; color: var(--good); font-weight: 700; }
  .cons li::before { content: "−"; color: var(--bad); font-weight: 700; }

  .tag {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    grid-column: 1 / -1;
    padding: 60px 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes shing {
    0% { transform: rotate(0deg) scale(1); }
    30% { transform: rotate(-6deg) scale(1.04); }
    60% { transform: rotate(4deg) scale(1.02); }
    100% { transform: rotate(0deg) scale(1); }
  }
</style>
</head>
<body>

<header>
  <h1>Ножи</h1>
  <p>Три глаза на каждый клинок — плюсы, минусы, честно.</p>
</header>

<div class="filters" id="filters">
  <button data-filter="all" class="active">Все</button>
  <button data-filter="fixed">Фиксед</button>
  <button data-filter="folder">Складные</button>
  <button data-filter="kitchen">Кухонные</button>
</div>

<div class="grid" id="grid"></div>

<script>
const knives = [
  {
    name: "Ka-Bar USMC",
    type: "fixed",
    typeLabel: "Фиксед",
    tag: "Полевой",
    pros: ["Ломается редко", "Пронзает всё подряд", "Цена-качество топ"],
    cons: ["Тяжёлый на поясе", "Кожан — отстой", "Рукоять скользит от крови"]
  },
  {
    name: "Opinel No. 8",
    type: "folder",
    typeLabel: "Складной",
    tag: "Классика",
    pros: ["Копеечный", "Лёгкий, карман не тянет", "Сталь с углеродом — рез на пятёрку"],
    cons: ["Ржавеет от взгляда", "Замок-вироблок разболтается", "Одной рукой не откроешь"]
  },
  {
    name: "Spyderco Delica",
    type: "folder",
    typeLabel: "Складной",
    tag: "EDC",
    pros: ["Открывается большим пальцем", "VG-10 держит кромку", "Клипса в комплекте"],
    cons: ["Цена кусает", "Рукоять пластик", "Люфт фрейма со временем"]
  },
  {
    name: "Victorinox Santoku",
    type: "kitchen",
    typeLabel: "Кухонный",
    tag: "Кухня",
    pros: ["Режет овощи как масло", "Нержавейка не ржавеет", "Точится легко"],
    cons: ["Тонкое лезвие ломко на костях", "Рукоять простая", "Не для тяжёлой работы"]
  },
  {
    name: "Morakniv Companion",
    type: "fixed",
    typeLabel: "Фиксед",
    tag: "Аутдор",
    pros: ["Дешёвый и неубиваемый", "Углеродка скандинав", "Чехол в комплекте"],
    cons: ["Рукоять простенькая", "Ножны люфтят", "Ржавеет без ухода"]
  },
  {
    name: "Gerber LMF II",
    type: "fixed",
    typeLabel: "Фиксед",
    tag: "Тактикал",
    pros: ["Выживает после падений", "Рукоять не натирает", "Режет провода и ремни"],
    cons: ["Тяжёлый", "Рукоять толстая под маленькую руку", "Цена за бренд"]
  }
];

const svgKnife = (type) => {
  if (type === "kitchen") {
    return `<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="k1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#eef2f5"/><stop offset=".5" stop-color="#b9c2cb"/><stop offset="1" stop-color="#7d868f"/>
      </linearGradient></defs>
      <path d="M20 90 L150 90 L185 55 L150 45 L20 60 Z" fill="url(#k1)" stroke="#5d666e" stroke-width="1.5"/>
      <rect x="10" y="70" width="45" height="18" rx="4" fill="#3a2f26" stroke="#241d17" stroke-width="1.5"/>
      <circle cx="22" cy="79" r="2.5" fill="#cfd6dd"/>
      <circle cx="34" cy="79" r="2.5" fill="#cfd6dd"/>
    </svg>`;
  }
  if (type === "folder") {
    return `<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="k2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#eef2f5"/><stop offset=".5" stop-color="#b9c2cb"/><stop offset="1" stop-color="#7d868f"/>
      </linearGradient></defs>
      <path d="M70 62 L170 62 L170 48 L70 48 Z" fill="url(#k2)" stroke="#5d666e" stroke-width="1.5"/>
      <path d="M60 56 L70 50 L70 70 L60 64 Z" fill="#3a2f26" stroke="#241d17" stroke-width="1.5"/>
      <rect x="30" y="52" width="34" height="22" rx="5" fill="#4a3b2e" stroke="#241d17" stroke-width="1.5"/>
      <circle cx="47" cy="63" r="3" fill="#cfd6dd"/>
    </svg>`;
  }
  return `<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="k3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f5"/><stop offset=".5" stop-color="#b9c2cb"/><stop offset="1" stop-color="#7d868f"/>
    </linearGradient></defs>
    <path d="M55 62 L150 62 L175 45 L150 55 L55 55 Z" fill="url(#k3)" stroke="#5d666e" stroke-width="1.5"/>
    <path d="M50 55 L55 50 L55 70 L50 65 Z" fill="#3a2f26" stroke="#241d17" stroke-width="1.5"/>
    <rect x="18" y="52" width="34" height="22" rx="6" fill="#4a3b2e" stroke="#241d17" stroke-width="1.5"/>
    <circle cx="26" cy="63" r="2" fill="#cfd6dd"/>
    <circle cx="40" cy="63" r="2" fill="#cfd6dd"/>
  </svg>`;
};

const grid = document.getElementById("grid");

function render(filter = "all") {
  const list = filter === "all" ? knives : knives.filter(k => k.type === filter);
  if (!list.length) {
    grid.innerHTML = `<div class="empty">Пусто. Другие фильтры потыкай.</div>`;
    return;
  }
  grid.innerHTML = list.map(k => `
    <article class="card">
      <span class="tag">${k.tag}</span>
      <div class="blade">${svgKnife(k.type)}</div>
      <h2>${k.name}</h2>
      <span class="type">${k.typeLabel}</span>
      <div class="lists">
        <div class="pros">
          <h3>Плюсы</h3>
          <ul>${k.pros.map(p => `<li>${p}</li>`).join("")}</ul>
        </div>
        <div class="cons">
          <h3>Минусы</h3>
          <ul>${k.cons.map(c => `<li>${c}</li>`).join("")}</ul>
        </div>
      </div>
    </article>
  `).join("");

  grid.querySelectorAll(".card").forEach(card => {
    card.addEventListener("mousemove", e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty("--mx", `${e.clientX - r.left}px`);
    });
  });
}

document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render(btn.dataset.filter);
});

render();
</script>
</body>
</html>
